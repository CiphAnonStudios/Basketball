<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meteor Hoops</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game-wrapper">
    <h1>🌠 Meteor Hoops 🏀</h1>
<div class="stats">
  <span>Score: <b id="score">0</b></span>
  <span>Lives: <b id="lives">3</b></span>
  <span>Level: <b id="level">1</b></span>
  <span>Combo: <b id="combo">0</b></span>
</div>

<canvas id="gameCanvas" width="900" height="560"></canvas>

<div class="instructions">
  <p><b>Move:</b> A/D or arrow keys</p>
  <p><b>Shoot:</b> Spacebar or click the screen</p>
  <p>Score baskets, build combos, and dodge meteors!</p>
</div>

<button id="startButton">Start Game</button>

  </main>
  <script src="script.js"></script>
</body>
</html>
